# Railway Configuration for Worker Service
# Service name: worker
# Root directory: backend

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
startCommand = "celery -A workers.celery_app worker --loglevel=info --concurrency=4"

# Workers don't need health checks but can use this
healthcheckTimeout = 100

