version: '3.8'

services:
  # PostgreSQL Database - Ephemeral (for transcripts/documents)
  db:
    image: postgres:15-alpine
    container_name: depodigest-db-ephemeral
    environment:
      POSTGRES_DB: depodigest_ephemeral
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_ephemeral_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database - Persistent (for users/auth/feedback)
  db_persistent:
    image: postgres:15-alpine
    container_name: depodigest-db-persistent
    environment:
      POSTGRES_DB: depodigest_persistent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_persistent_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: depodigest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: depodigest-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/depodigest_ephemeral
      - PERSISTENT_DATABASE_URL=postgresql://postgres:postgres@db_persistent:5432/depodigest_persistent
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FRONTEND_URL=http://localhost:3000
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      db_persistent:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - upload_temp:/tmp/uploads
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Workers (scaled for performance)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: depodigest-worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/depodigest_ephemeral
      - PERSISTENT_DATABASE_URL=postgresql://postgres:postgres@db_persistent:5432/depodigest_persistent
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - WORKERS_COUNT=4
    depends_on:
      - db
      - db_persistent
      - redis
    volumes:
      - ./backend:/app
      - upload_temp:/tmp/uploads
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    deploy:
      replicas: 2  # Run 2 worker instances for better performance

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: depodigest-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_ephemeral_data:
  postgres_persistent_data:
  redis_data:
  upload_temp:

networks:
  default:
    name: depodigest-network








